# =========================
# RESILIENCE4J
# =========================
resilience4j:
  circuitbreaker:
    instances:

      customerCircuitBreaker:

        # Number of calls kept in the sliding window
        sliding-window-size: 10

        # Percentage of failed calls required to open circuit
        failure-rate-threshold: 50

        # Minimum number of calls before failure rate is calculated
        minimum-number-of-calls: 5

        # Time circuit stays OPEN
        wait-duration-in-open-state: 10s

        # Number of test calls allowed in HALF_OPEN
        permitted-number-of-calls-in-half-open-state: 3

        # Automatically transition OPEN -> HALF_OPEN
        automatic-transition-from-open-to-half-open-enabled: true
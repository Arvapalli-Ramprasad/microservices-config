spring:

  cloud:
    gateway:
      server:
        webflux:

          routes:

            # =========================
            # CUSTOMER SERVICE
            # =========================
            - id: customer-service-route
              uri: lb://customer-service
              predicates:
                - Path=/customers/**

              filters:
                - name: CircuitBreaker
                  args:
                    name: customerCircuitBreaker
                    fallbackUri: forward:/fallback/customer

            # =========================
            # ACCOUNT SERVICE
            # =========================
            - id: account-service-route
              uri: lb://account-service

              predicates:
                - Path=/accounts/**

              filters:
                - name: CircuitBreaker
                  args:
                    name: accountCircuitBreaker
                    fallbackUri: forward:/fallback/accounts

          # =========================
          # CORS
          # =========================
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS

                allowedHeaders:
                  - Authorization
                  - Content-Type


